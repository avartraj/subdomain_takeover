<!DOCTYPE html>
<html>

    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .alert { color: red; }
    </style>
</head>
<body>
    <h1>Wispr Flow</h1>
    <p>Your account has been suspended. Please verify your identity:</p>
